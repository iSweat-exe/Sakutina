name: CI Pipeline

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['main']

jobs:
    build-and-test:
        name: Build & Type Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Dependency Vulnerability Audit
              run: bun audit

            - name: Mojibake Check
              run: |
                  if grep -rIl --exclude-dir={node_modules,.git,dist,build,.next,.turbo} $'\xc3\xa2\xe2\x82\xac' .; then
                    echo "Mojibake sequence found in the files above (likely an em dash saved as Latin-1/CP1252 then re-saved as UTF-8). Re-save the file as clean UTF-8."
                    exit 1
                  fi

            - name: TypeScript Type Checking
              run: bun run typecheck

            - name: Unit Tests
              run: bun run test

            - name: Formatting Check
              run: bun run lint
