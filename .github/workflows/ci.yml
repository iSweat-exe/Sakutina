name: CI Pipeline

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['main']

jobs:
    build-and-test:
        name: Build & Type Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: TypeScript Type Checking
              run: bun run typecheck

            # Optionnel: Ajoute tes scripts de linting/tests ici à l'avenir
            # - name: Run Linter
            #   run: bun run lint
            # - name: Run Tests
            #   run: bun test
