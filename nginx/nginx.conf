worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name _;

        # Docker's embedded DNS (127.0.0.11) re-resolves panel-server on
        # every request (via the variable), instead of caching its IP
        # forever like a bare `proxy_pass http://panel-server:8080;` would
        # — otherwise nginx keeps pointing at a dead IP after the backend
        # container restarts or gets recreated.
        resolver 127.0.0.11 valid=10s;

        location ~ ^/(api|auth)/ {
            set $panel_server_upstream panel-server:8080;
            proxy_pass http://$panel_server_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $panel_client_upstream panel-client:80;
            proxy_pass http://$panel_client_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # TODO: add a `server { listen 443 ssl; ... }` block once TLS
    # certificates are provisioned (e.g. certbot). Port 443 is already
    # published in docker-compose.yml for when that lands.
}
